[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "servicelevel"
version = "0.1.0"
description = "Contact-centre service level under four abandon rules as a ratio of sums, plus an overflow-safe Erlang C staffing gap, in Power BI checked against SQL."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "servicelevel contributors" }]
dependencies = [
    "duckdb>=1.1,<3",
    "numpy>=1.26,<3",
    "pandas>=2.2,<4",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "hypothesis>=6.100", "ruff>=0.6"]

[project.scripts]
servicelevel = "servicelevel.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/servicelevel"]

[tool.hatch.build.targets.wheel.force-include]
"sql" = "servicelevel/sql"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".tmp", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
